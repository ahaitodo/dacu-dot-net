<script>
(function(){
  var PROMOS = {
    nationalday: {
      hash:'#nationalday',
      theme:'theme-nationalday',
      themeColor:'#c8102e',
      badge:'NATIONAL DAY · COMING SOON',
      line1:'国庆大促即将',
      line2:'启动',
      ledeHTML:'10 月 1 日 00:00 准时开抢。<br>准备好<b>全网最低价</b>与<b>国庆专属福利</b>。',
      titleTpl:function(d,h,mi,s){return d>0?('国庆大促 · '+d+'天 '+h+':'+mi+':'+s):'国庆大促已启动!'},
      target:function(now,year){var T=new Date(year,9,1,0,0,0,0);if(T.getTime()<=now.getTime())T=new Date(year+1,9,1,0,0,0,0);return T},
      hints:['满 300 减 50','爆款直降 低至 1 折','国庆限定礼盒']
    },
    double11: {
      hash:'#double11',
      theme:'theme-double11',
      themeColor:'#ff4d2e',
      badge:'DOUBLE 11 · COMING SOON',
      line1:'双 11 大促即将',
      line2:'启动',
      ledeHTML:'11 月 11 日 00:00 准时开抢。<br>准备好<b>全年最低价</b>与<b>红包雨福利</b>。',
      titleTpl:function(d,h,mi,s){return d>0?('双 11 大促 · '+d+'天 '+h+':'+mi+':'+s):'双 11 已启动!'},
      target:function(now,year){var T=new Date(year,10,11,0,0,0,0);if(T.getTime()<=now.getTime())T=new Date(year+1,10,11,0,0,0,0);return T},
      hints:['跨店满 300 减 50','超级红包雨','爆款 5 折秒']
    }
  };

  var currentKey=null,tickHandle=null;
  var stage=document.getElementById('stage'),
      pillBar=document.querySelector('.nav'),
      elBadge=document.getElementById('badge'),
      elL1=document.getElementById('line1'),
      elL2=document.getElementById('line2'),
      elLede=document.getElementById('lede'),
      elHints=[document.getElementById('h1'),document.getElementById('h2'),document.getElementById('h3')],
      themeMeta=document.querySelector('meta[name="theme-color"]');

  function pad(n){return String(Math.max(0,Math.floor(n))).padStart(2,'0')}

  function applyPromo(key){
    var p=PROMOS[key]; if(!p) return;
    if(currentKey===key) return;
    currentKey=key;

    // theme swap
    document.body.classList.remove('theme-nationalday','theme-double11');
    document.body.classList.add(p.theme);
    themeMeta.setAttribute('content',p.themeColor);

    // pill active
    var pills=pillBar.querySelectorAll('.pill');
    for(var i=0;i<pills.length;i++){
      pills[i].classList.toggle('active',pills[i].dataset.target===key);
    }

    // content swap (with re-trigger animation)
    elBadge.textContent=p.badge;
    elL1.textContent=p.line1;
    elL2.textContent=p.line2;
    elLede.innerHTML=p.ledeHTML;
    for(var j=0;j<3;j++) elHints[j].textContent=p.hints[j];

    // restart fade
    stage.style.animation='none';
    void stage.offsetWidth;
    stage.style.animation='';

    // hash sync (without scroll jump)
    if(location.hash!==p.hash){
      history.replaceState(null,'',' '+p.hash);
    }

    // countdown rebind
    if(tickHandle) clearInterval(tickHandle);
    var now=new Date();
    var T=p.target(now,now.getFullYear());

    function tick(){
      var x=Math.max(0,T.getTime()-Date.now());
      var da=Math.floor(x/864e5);x-=da*864e5;
      var ho=Math.floor(x/36e5);x-=ho*36e5;
      var mi=Math.floor(x/6e4);x-=mi*6e4;
      var se=Math.floor(x/1e3);
      d.textContent=pad(da);h.textContent=pad(ho);
      m.textContent=pad(mi);s.textContent=pad(se);
      var sum=da+ho+mi+se;
      document.title = sum>0
        ? p.titleTpl(pad(da),pad(ho),pad(mi),pad(se))
        : p.titleTpl(0,'00','00','00');
    }
    tick();
    tickHandle=setInterval(tick,1000);
  }

  // initial: read hash or default to nationalday
  function readKey(){
    var h=(location.hash||'').replace('#','');
    return PROMOS[h] ? h : 'nationalday';
  }

  // bind pills
  var pills=pillBar.querySelectorAll('.pill');
  for(var i=0;i<pills.length;i++){
    (function(btn){
      btn.addEventListener('click',function(){ applyPromo(btn.dataset.target); });
    })(pills[i]);
  }

  // hash change (back/forward)
  window.addEventListener('hashchange',function(){ applyPromo(readKey()); });

  // copy wechat
  document.getElementById('copyBtn').addEventListener('click',function(){
    var id='9262895',m=document.getElementById('wxmsg'),btn=this;
    function ok(){
      m.style.color='#2ecc71';
      m.textContent='✓ 已复制微信号 '+id+' · 请在微信中搜索添加';
      btn.textContent='已复制';
      setTimeout(function(){btn.textContent='复制';m.textContent=''},3000);
    }
    function fallback(){
      try{
        var ta=document.createElement('textarea');
        ta.value=id;ta.style.position='fixed';ta.style.opacity='0';
        document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        ok();
      }catch(e){
        m.style.color='#ff4d2e';m.textContent='复制失败,请手动复制: '+id;
      }
    }
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(id).then(ok).catch(fallback)}else{fallback()}
  });

  // footer year
  document.getElementById('y').textContent=new Date().getFullYear();

  // boot
  applyPromo(readKey());
})();
</script>
