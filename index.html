<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0c"><title>大促即将启动</title><style>:root{--bg:#0a0a0c;--fg:#f5f5f7;--soft:#b8b8c0;--muted:#7a7a82;--accent:#ff4d2e;--accent2:#ffb800;--grad:linear-gradient(135deg,#ff4d2e,#ffb800)}*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh;display:flex;flex-direction:column}body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 0%,#1a1a22,var(--bg) 70%)}body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;pointer-events:none;background:radial-gradient(circle at 15% 20%,var(--accent),transparent 45%),radial-gradient(circle at 85% 80%,var(--accent2),transparent 50%);filter:blur(60px)}main{flex:1;max-width:880px;margin:0 auto;padding:5rem 1.25rem 3rem;text-align:center;display:flex;flex-direction:column;align-items:center}.badge{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .85rem;border:1px solid rgba(255,255,255,.1);border-radius:100px;background:rgba(255,255,255,.04);font-size:.7rem;letter-spacing:.12em;color:var(--soft);margin-bottom:2rem}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,77,46,.25);animation:b 1.6s ease-in-out infinite}@keyframes b{50%{opacity:.4}}h1{font-size:clamp(2.5rem,10vw,5.5rem);font-weight:800;line-height:1.1;letter-spacing:-.03em;margin-bottom:1.25rem}h1 span{display:block}h1 .ac{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}h1 .cur{display:inline-block;color:var(--accent);animation:c 1s steps(1) infinite;font-weight:400}@keyframes c{50%{opacity:0}}.lede{font-size:clamp(.95rem,2.2vw,1.125rem);color:var(--soft);max-width:520px;margin:0 auto 2.5rem;line-height:1.7}.lede b{color:var(--fg)}.cd{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-bottom:2.5rem;flex-wrap:wrap;font-family:ui-monospace,Menlo,Consolas,monospace}.cd .c{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:.75rem .9rem;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:.2rem}.cd .n{font-size:clamp(1.5rem,5vw,2.25rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}.cd .l{font-size:.65rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}.cd .s{font-size:clamp(1.25rem,4vw,1.75rem);color:var(--muted);animation:b 1.6s ease-in-out infinite}form{width:100%;max-width:480px;margin-bottom:2.5rem}.box{display:flex;gap:.5rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:.4rem;transition:.2s}.box:focus-within{border-color:rgba(255,77,46,.5);box-shadow:0 0 0 4px rgba(255,77,46,.12)}input{flex:1;background:transparent;border:none;outline:none;padding:.65rem .9rem;color:var(--fg);font-size:.9375rem;font-family:inherit}input::placeholder{color:var(--muted)}button{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.1rem;border:none;border-radius:100px;background:var(--grad);color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}button:disabled{opacity:.6}.msg{margin-top:.65rem;font-size:.8rem;min-height:1.2em;color:var(--muted);padding-left:1.1rem;text-align:left}.msg.s{color:#2ecc71}.msg.e{color:var(--accent)}.hints{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem 1.5rem;padding:1rem .5rem;color:var(--soft);font-size:.875rem}.hints span{display:inline-flex;align-items:center;gap:.4rem}.hints span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent2)}footer{text-align:center;padding:1rem;font-size:.75rem;color:var(--muted)}footer a{color:var(--soft)}@media(max-width:520px){.box{flex-direction:column;border-radius:14px;background:transparent;border:none;padding:0}input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:.75rem 1.1rem}button{justify-content:center;width:100%}.cd .c{min-width:62px;padding:.6rem .55rem}}</style></head><body><main><div class="badge"><span class="dot"></span><span>SYSTEM · COMING SOON</span></div><h1><span>大促即将</span><span class="ac">启动<span class="cur">_</span></span></h1><p class="lede">我们正在做最后的准备。<br>准备好接收<b>全网最低价</b>与<b>限时福利</b>。</p><div class="cd"><div class="c"><span class="n" id="d">--</span><span class="l">天</span></div><span class="s">:</span><div class="c"><span class="n" id="h">--</span><span class="l">时</span></div><span class="s">:</span><div class="c"><span class="n" id="m">--</span><span class="l">分</span></div><span class="s">:</span><div class="c"><span class="n" id="s">--</span><span class="l">秒</span></div></div><form id="f" novalidate><div class="box"><input id="e" type="email" placeholder="输入邮箱,第一时间获取提醒" required><button type="submit">订阅提醒 →</button></div><p class="msg" id="msg"></p></form><div class="hints"><span>爆款直降 低至 1 折起</span><span>限时优惠券 先到先得</span><span>VIP 专属通道</span></div></main><footer>© <span id="y"></span> Dacu · <a>dacu.net</a></footer><script>var C={d:14,hr:20,mi:0};var T=new Date();T.setDate(T.getDate()+C.d);T.setHours(C.hr,C.mi,0,0);function p(n){return String(Math.max(0,Math.floor(n))).padStart(2,"0")}function tick(){var x=Math.max(0,T.getTime()-Date.now());var da=Math.floor(x/864e5);x-=da*864e5;var ho=Math.floor(x/36e5);x-=ho*36e5;var mi=Math.floor(x/6e4);x-=mi*6e4;var se=Math.floor(x/1e3);d.textContent=p(da);h.textContent=p(ho);m.textContent=p(mi);s.textContent=p(se);document.title=(da+ho+mi+se)>0?"大促即将启动 · "+p(da)+":"+p(ho)+":"+p(mi)+":"+p(se):"大促已启动!"}tick();setInterval(tick,1000);y.textContent=new Date().getFullYear();f.addEventListener("submit",function(e){e.preventDefault();msg.className="msg";msg.textContent="";var em=e.email.value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){msg.className="msg e";msg.textContent="请输入有效的邮箱地址";return}var b=f.querySelector("button"),o=b.innerHTML;b.disabled=true;b.textContent="提交中...";try{var a=JSON.parse(localStorage.getItem("__s")||"[]");a.push({e:em,t:Date.now()});localStorage.setItem("__&#8203;s",JSON.stringify(a));msg.className="msg s";msg.textContent="✓ 已收到!启动前我们会第一时间通知你";f.reset()}catch(err){msg.className="msg e";msg.textContent="提交失败"}setTimeout(function(){b.disabled=false;b.innerHTML=o},1200)});</script></body></html>
