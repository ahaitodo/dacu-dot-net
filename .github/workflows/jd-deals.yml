name: jd-deals
on:
  schedule:
    - cron: '31 1 * * *'    # 北京时间 09:31
    - cron: '31 12 * * *'   # 北京时间 20:31(晚高峰前)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 拉取京东精选商品
        env:
          JD_APP_KEY: ${{ secrets.JD_APP_KEY }}
          JD_APP_SECRET: ${{ secrets.JD_APP_SECRET }}
          JD_APP_KEY2: ${{ secrets.JD_APP_KEY2 }}
          JD_APP_SECRET2: ${{ secrets.JD_APP_SECRET2 }}
        run: python tools/fetch_jd_deals.py
      - name: 提交并推送
        run: |
          git config user.name "dacu-bot"
          git config user.email "hi@dacu.net"
          git add assets/data/deals-jd.json
          if git diff --cached --quiet; then
            echo "无变化,跳过"
          else
            git commit -m "京东精选每日更新 $(date -u +%F)"
            git push
          fi
